<title>Eleven Degree Resort Availability</title>
<style>
:root{
  --bg:#FBF8F2; --surface:#FFFFFF; --surface-2:#F3EEE1; --border:#E5DCC6;
  --text:#22302A; --text-muted:#6E7A6F;
  --brand:#1F3A34; --brand-ink:#F8F4E8;
  --accent:#B8894B; --accent-ink:#7A5A2E; --accent-soft:#F1E4CC;
  --st-available-bg:#E1EEDE; --st-available-fg:#2E5A38;
  --st-booked-bg:#F5DAD3; --st-booked-fg:#8C3B2A;
  --st-inhouse-bg:#DAE7EA; --st-inhouse-fg:#28535F;
  --st-discount-bg:#F2E6C6; --st-discount-fg:#8A6A1E;
  --st-blocked-bg:#E4DBEC; --st-blocked-fg:#5A4478;
  --st-empty-bg:#F1EEE4; --st-empty-fg:#A7A196;
  --radius:10px;
  --shadow:0 1px 2px rgba(34,48,42,.06),0 4px 14px rgba(34,48,42,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141F1B; --surface:#1B2723; --surface-2:#22302A; --border:#33433B;
    --text:#EDE7D8; --text-muted:#A6AC9F;
    --brand:#0F1B17; --brand-ink:#F1EADA;
    --accent:#D8B478; --accent-ink:#EFD8A4; --accent-soft:#2B2416;
    --st-available-bg:#243A2A; --st-available-fg:#93CC9C;
    --st-booked-bg:#3C2822; --st-booked-fg:#E4A292;
    --st-inhouse-bg:#1E333B; --st-inhouse-fg:#92C6D8;
    --st-discount-bg:#3A3017; --st-discount-fg:#E3C574;
    --st-blocked-bg:#2C2438; --st-blocked-fg:#C9ACE6;
    --st-empty-bg:#20281F; --st-empty-fg:#5E6A5C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#141F1B; --surface:#1B2723; --surface-2:#22302A; --border:#33433B;
  --text:#EDE7D8; --text-muted:#A6AC9F;
  --brand:#0F1B17; --brand-ink:#F1EADA;
  --accent:#D8B478; --accent-ink:#EFD8A4; --accent-soft:#2B2416;
  --st-available-bg:#243A2A; --st-available-fg:#93CC9C;
  --st-booked-bg:#3C2822; --st-booked-fg:#E4A292;
  --st-inhouse-bg:#1E333B; --st-inhouse-fg:#92C6D8;
  --st-discount-bg:#3A3017; --st-discount-fg:#E3C574;
  --st-blocked-bg:#2C2438; --st-blocked-fg:#C9ACE6;
  --st-empty-bg:#20281F; --st-empty-fg:#5E6A5C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}

*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Work Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px; margin:0 auto; padding:0 16px 48px;}

header.hero{
  background:var(--brand); color:var(--brand-ink);
  padding:28px 16px 22px; margin-bottom:20px;
  border-bottom:3px solid var(--accent);
}
header.hero .inner{max-width:640px; margin:0 auto;}
header.hero .eyebrow{
  font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); font-weight:600; margin:0 0 6px;
}
header.hero h1{
  font-family:"Fraunces",Georgia,serif; font-weight:600;
  font-size:clamp(26px,7vw,34px); line-height:1.1; margin:0 0 6px;
  text-wrap:balance;
}
header.hero .sub{
  margin:0; font-size:14px; color:var(--brand-ink); opacity:.8;
}
header.hero .updated{
  margin:14px 0 0; font-size:12px; color:var(--brand-ink); opacity:.65;
  font-variant-numeric:tabular-nums;
}

.brandbar{
  background:#FFFFFF; text-align:center; padding:14px 16px 12px;
}
.brandbar img{
  width:55%; max-width:170px; height:auto; display:inline-block;
}

.legend{
  display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center;
  padding:14px 4px 6px; font-size:12.5px; color:var(--text-muted);
}
.legend .chip{display:flex; align-items:center; gap:6px;}
.legend .dot{width:10px; height:10px; border-radius:3px; flex:none;}

.cta{
  display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--accent); color:#231803; text-decoration:none;
  font-weight:600; font-size:14.5px; padding:13px 18px; border-radius:999px;
  margin:14px 4px 26px; box-shadow:var(--shadow);
}
.cta:active{transform:translateY(1px);}
.cta svg{width:18px; height:18px; flex:none;}

.month-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden;
}
.month-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding:14px 16px 10px;
}
.month-head h2{
  font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:19px; margin:0;
}
.month-head .counts{
  font-size:11.5px; color:var(--text-muted); font-variant-numeric:tabular-nums;
  text-align:right; line-height:1.4;
}
.grid{
  display:grid; grid-template-columns:repeat(7,1fr);
  border-top:1px solid var(--border);
}
.grid .wd{
  font-size:10.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
  color:var(--text-muted); text-align:center; padding:8px 2px 6px; background:var(--surface-2);
}
.grid .day{
  min-height:44px; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start;
  padding:4px 0 0 6px; border-right:1px solid var(--border); border-bottom:1px solid var(--border);
  font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; position:relative;
}
.grid .day:nth-child(7n+1){border-left:1px solid var(--border);}
.grid .day.empty{background:transparent; border-color:transparent;}
.grid .day.today{box-shadow:inset 0 0 0 2px var(--accent);}
.st-available{background:var(--st-available-bg); color:var(--st-available-fg);}
.st-booked{background:var(--st-booked-bg); color:var(--st-booked-fg);}
.st-inhouse{background:var(--st-inhouse-bg); color:var(--st-inhouse-fg);}
.st-discount{background:var(--st-discount-bg); color:var(--st-discount-fg);}
.st-blocked{background:var(--st-blocked-bg); color:var(--st-blocked-fg);}
.st-nodata{background:var(--st-empty-bg); color:var(--st-empty-fg);}

.datastatus{
  display:inline-block; margin:12px 0 0; font-size:11px; font-weight:600;
  padding:3px 10px; border-radius:999px;
  background:rgba(255,255,255,.14); color:var(--brand-ink);
  font-variant-numeric:tabular-nums;
}
.datastatus.ok{ background:rgba(120,210,150,.24); color:#d9f7e0; }
.datastatus.warn{ background:rgba(255,190,120,.26); color:#ffe6c6; }

footer{
  text-align:center; color:var(--text-muted); font-size:12px; padding:18px 16px 4px;
  line-height:1.6;
}
footer a{color:var(--accent-ink); font-weight:600; text-decoration:none;}
</style>

let BOOKING_DATA = Object.assign({}, FALLBACK_DATA);

const STATUS_META = {
  "Available":       {label:"Available",        cls:"st-available"},
  "Booked":          {label:"Booked",            cls:"st-booked"},
  "In-House Booking":{label:"In-House Booking",  cls:"st-booked"},
  "Discount":        {label:"Discount",          cls:"st-booked"},
  "Blocked":         {label:"Blocked",           cls:"st-booked"}
};
const COUNT_ORDER = ["Available","Booked","In-House Booking","Discount","Blocked"];
const LEGEND = [
  {label:"Available",     cls:"st-available"},
  {label:"Not available", cls:"st-booked"}
];
const MONTH_NUM = {January:1,February:2,March:3,April:4,May:5,June:6,
  July:7,August:8,September:9,October:10,November:11,December:12};

const MONTH_NAMES = ["January","February","March","April","May","June","July","August",
  "September","October","November","December"];
const WD = ["Su","Mo","Tu","We","Th","Fr","Sa"];

function pad(n){ return n<10 ? "0"+n : ""+n; }
function ymd(y,m,d){ return y+"-"+pad(m+1)+"-"+pad(d); }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function firstWeekday(y,m){ return new Date(y, m, 1).getDay(); }

/* ---- CSV loading ---- */
function parseCSV(text){
  const rows=[]; let i=0, field="", row=[], inq=false;
  while(i<text.length){
    const c=text[i];
    if(inq){
      if(c==='"'){ if(text[i+1]==='"'){field+='"'; i+=2; continue;} inq=false; i++; continue; }
      field+=c; i++; continue;
    } else {
      if(c==='"'){ inq=true; i++; continue; }
      if(c===','){ row.push(field); field=""; i++; continue; }
      if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; i++; continue; }
      if(c==='\r'){ i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function buildFromCSV(text){
  const rows=parseCSV(text);
  const out={};
  for(const r of rows){
    if(r.length<5) continue;
    const monName=(r[2]||"").trim();
    const status=(r[4]||"").trim();
    const month=MONTH_NUM[monName];
    const year=parseInt((r[3]||"").trim(),10);
    if(!month || !STATUS_META[status] || !(year>2000)) continue;
    const toks=(r[0]||"").match(/\d+/g);
    if(!toks) continue;
    const nums=toks.map(Number);
    let rem=nums.slice();
    let yi=rem.indexOf(year); if(yi>=0) rem.splice(yi,1);
    let mi=rem.indexOf(month); if(mi>=0) rem.splice(mi,1);
    const day = rem.length ? rem[0] : null;
    if(!day || day<1 || day>31) continue;
    out[year+"-"+pad(month)+"-"+pad(day)] = status;
  }
  return out;
}

function setUpdatedToday(){
  const el=document.querySelector(".updated");
  if(!el) return;
  const d=new Date();
  const mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  el.textContent="Updated "+d.getDate()+" "+mn[d.getMonth()]+" "+d.getFullYear();
}

let LOAD_STATE = {state:"loading", count:0, at:null, reason:""};

async function loadData(){
  if(!SHEET_CSV_URL){
    LOAD_STATE={state:"snapshot", reason:"no live source configured", count:0, at:new Date()};
    return false;
  }
  try{
    const url = SHEET_CSV_URL + (SHEET_CSV_URL.indexOf("?")>=0 ? "&" : "?") + "_cb=" + Date.now();
    const res = await fetch(url, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const parsed = buildFromCSV(await res.text());
    const n = Object.keys(parsed).length;
    if(n > 50){
      BOOKING_DATA = parsed;
      setUpdatedToday();
      LOAD_STATE={state:"live", count:n, at:new Date(), reason:""};
      return true;
    }
    if(LOAD_STATE.state!=="live")
      LOAD_STATE={state:"snapshot", count:n, at:new Date(),
        reason:"reached the sheet but its layout wasn\u2019t recognised (is the published tab the Database tab?)"};
  }catch(e){
    console.warn("Live booking fetch failed; showing saved snapshot.", e);
    if(LOAD_STATE.state!=="live")
      LOAD_STATE={state:"snapshot", count:0, at:new Date(),
        reason:"couldn\u2019t reach the live sheet from here"};
  }
  return false;
}

function fmtTime(d){ let h=d.getHours(), m=d.getMinutes(); const ap=h<12?"AM":"PM"; h=h%12||12; return h+":"+(m<10?"0":"")+m+" "+ap; }
function renderStatus(){
  const el=document.getElementById("datastatus"); if(!el) return;
  const s=LOAD_STATE;
  if(s.state==="live"){
    el.className="datastatus ok";
    el.style.display="inline-block";
    el.textContent="\u25CF Live from sheet \u00b7 "+s.count+" dates \u00b7 "+fmtTime(s.at);
  } else {
    el.style.display="none";
    el.textContent="";
  }
}

function renderLegend(){
  const el = document.getElementById("legend");
  el.innerHTML = LEGEND.map(item=>
    '<span class="chip"><span class="dot '+item.cls+'"></span>'+item.label+'</span>'
  ).join("");
}

function renderMonths(){
  const now = new Date();
  const startY = now.getFullYear(), startM = now.getMonth();
  const today = ymd(now.getFullYear(), now.getMonth(), now.getDate());
  const host = document.getElementById("months");
  host.innerHTML = "";

  for(let i=0;i<6;i++){
    const d = new Date(startY, startM+i, 1);
    const y = d.getFullYear(), m = d.getMonth();
    const nD = daysInMonth(y,m);
    const fw = firstWeekday(y,m);

    const counts = {Available:0,Booked:0,"In-House Booking":0,Discount:0,Blocked:0};
    let haveAny = false;

    let cellsHtml = "";
    const totalCells = Math.ceil((fw+nD)/7)*7;
    for(let c=0;c<totalCells;c++){
      const dayNum = c - fw + 1;
      if(dayNum < 1 || dayNum > nD){
        cellsHtml += '<div class="day empty"></div>';
        continue;
      }
      const dateStr = ymd(y,m,dayNum);
      const status = BOOKING_DATA[dateStr];
      const isToday = dateStr === today;
      if(status && STATUS_META[status]){
        counts[status] = (counts[status]||0)+1;
        haveAny = true;
        cellsHtml += '<div class="day '+STATUS_META[status].cls+(isToday?' today':'')+'">'+dayNum+'</div>';
      } else {
        cellsHtml += '<div class="day st-booked'+(isToday?' today':'')+'">'+dayNum+'</div>';
      }
    }

    const avail = counts["Available"]||0;
    const total = COUNT_ORDER.reduce((sum,k)=>sum+(counts[k]||0),0);
    const unavail = total - avail;
    const parts = [];
    if(avail) parts.push(avail+" available");
    if(unavail) parts.push(unavail+" booked");
    const summary = parts.join(" \u00b7 ") || (haveAny ? "" : "no data yet");

    const card = document.createElement("div");
    card.className = "month-card";
    card.innerHTML =
      '<div class="month-head"><h2>'+MONTH_NAMES[m]+' '+y+'</h2>'+
      '<div class="counts">'+summary+'</div></div>'+
      '<div class="grid">'+
      WD.map(w=>'<div class="wd">'+w+'</div>').join("")+
      cellsHtml+
      '</div>';
    host.appendChild(card);
  }
}

renderLegend();
renderMonths();               // instant paint from snapshot
renderStatus();
function refresh(){ return loadData().then(()=>{ renderMonths(); renderStatus(); }); }
refresh();                              // pull live data now
setInterval(refresh, 5*60*1000);       // and re-check every 5 minutes
</script>
